<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{name}} - {{target_role}}</title>
<style>
:root { --ink:#111827; --muted:#4b5563; --line:#d1d5db; --accent:#1d4ed8; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--ink); font:10.5pt/1.58 "Microsoft YaHei","PingFang SC",Arial,sans-serif; }
.page { width:100%; max-width:180mm; margin:0 auto; }
h1 { margin:0; font-size:23pt; letter-spacing:0; }
h2 { margin:16pt 0 7pt; padding-bottom:3pt; border-bottom:1pt solid var(--accent); font-size:13pt; color:var(--accent); }
p { margin:4pt 0; }.muted { color:var(--muted); }.header { border-bottom:2pt solid var(--accent); padding-bottom:8pt; }
.meta { margin-top:3pt; color:var(--muted); }.role { margin-top:6pt; font-weight:700; }
.item { margin:9pt 0; break-inside:avoid; }.item-title { font-weight:700; }.date { float:right; color:var(--muted); }
ul { margin:4pt 0 0; padding-left:18pt; }li { margin:3pt 0; }.stack { color:var(--muted); font-size:9.5pt; }
.skills p { margin:3pt 0; }.label { display:inline-block; min-width:80pt; font-weight:700; }
@page { size:A4; margin:14mm 15mm; }
@media print { .page{max-width:none}.item,h2{break-inside:avoid;page-break-inside:avoid} }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <h1>{{name}}</h1>
    <p class="meta">{{phone}} ｜ {{email}} ｜ {{location}}</p>
    <p class="role">求职意向：{{target_role}}</p>
  </header>
  <section><h2>职业摘要</h2><p>{{summary}}</p></section>
  <section><h2>实习 / 工作经历</h2>{{experience_items}}</section>
  <section><h2>项目经历</h2>{{project_items}}</section>
  <section class="skills"><h2>专业技能</h2>{{skill_items}}</section>
  <section><h2>教育经历</h2>{{education_items}}</section>
</main>
</body>
</html>
